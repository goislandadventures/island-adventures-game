name: Import Splash Asset
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-splash-asset.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Download generated 4K splash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/branding
          curl --fail --location --retry 3 --output public/branding/island-adventures-splash-4k.jpg 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-21c0-81f5-afaa-dded04cd31f9/raw?se=2026-10-02T08%3A04%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=754049a4-a56a-5982-a55d-7f1be9efff29&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T02%3A40%3A25Z&ske=2026-10-03T02%3A40%3A25Z&sks=b&skv=2026-02-06&sig=nPzyxNvFteqv9UkzeIkQ2Bmos%2BXRDc2lxjhzFdGY0as%3D'
          test -s public/branding/island-adventures-splash-4k.jpg
          file public/branding/island-adventures-splash-4k.jpg
          BYTES=$(wc -c < public/branding/island-adventures-splash-4k.jpg)
          test "$BYTES" -gt 400000
      - name: Commit splash asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/branding/island-adventures-splash-4k.jpg
          git commit -m "Add 4K Island Adventures splash asset"
          git push origin HEAD:main
