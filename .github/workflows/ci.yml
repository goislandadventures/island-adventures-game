name: Build Check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:captain-school
      - run: npm run test:maintenance
      - run: npm run test:hidden-rolls
      - run: npm run test:weather-climate
      - run: npm run test:second-boat
      - run: npm run test:calendar-business-save
      - name: Write build ID
        run: echo "$GITHUB_SHA" > public/build-id.txt
      - name: Build
        env:
          VITE_BUILD_ID: ${{ github.sha }}
        run: npm run build
