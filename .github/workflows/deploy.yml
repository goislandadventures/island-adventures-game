name: Deploy Island Adventures
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Check Cloudflare credentials
        id: cf
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy skipped: repository secrets are not configured yet."
          fi

      - uses: actions/setup-node@v6
        if: steps.cf.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.cf.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Resolve D1 database
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          DB_ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const x=a.find(v=>v.name==='island-adventures-game');if(x)process.stdout.write(x.uuid||x.id||'')})")
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create island-adventures-game --jurisdiction us
            DB_ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const x=a.find(v=>v.name==='island-adventures-game');if(x)process.stdout.write(x.uuid||x.id||'')})")
          fi
          if [ -z "$DB_ID" ]; then
            echo "Could not resolve D1 database ID" >&2
            exit 1
          fi
          sed -i "s/REPLACE_AFTER_D1_CREATE/$DB_ID/g" wrangler.toml
          grep -q "$DB_ID" wrangler.toml

      - name: Apply database migrations
        if: steps.cf.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote

      - name: Build
        if: steps.cf.outputs.ready == 'true'
        run: npm run build

      - name: Deploy Worker and assets
        if: steps.cf.outputs.ready == 'true'
        run: npx wrangler deploy
