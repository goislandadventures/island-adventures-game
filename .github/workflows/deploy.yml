name: Deploy Island Adventures
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Resolve D1 database
        shell: bash
        run: |
          DB_ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s).find(v=>v.name==='island-adventures-game');if(x)process.stdout.write(x.uuid||x.id||'')})")
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create island-adventures-game --binding DB --update-config --jurisdiction us
          else
            sed -i "s/REPLACE_AFTER_D1_CREATE/$DB_ID/g" wrangler.toml
          fi
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote
      - run: npm run build
      - name: Deploy Worker and assets
        run: npx wrangler deploy
