name: Deploy Island Adventures
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Check Cloudflare credentials
        id: cf
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy skipped: repository secrets are not configured yet."
          fi

      - uses: actions/setup-node@v6
        if: steps.cf.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.cf.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Resolve D1 database
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          DB_ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const x=a.find(v=>v.name==='island-adventures-game');if(x)process.stdout.write(x.uuid||x.id||'')})")
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create island-adventures-game --jurisdiction us
            DB_ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const x=a.find(v=>v.name==='island-adventures-game');if(x)process.stdout.write(x.uuid||x.id||'')})")
          fi
          if [ -z "$DB_ID" ]; then
            echo "Could not resolve D1 database ID" >&2
            exit 1
          fi
          sed -i "s/REPLACE_AFTER_D1_CREATE/$DB_ID/g" wrangler.toml
          grep -q "$DB_ID" wrangler.toml

      - name: Apply database migrations
        if: steps.cf.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote

      - name: Verify Captain School bookings
        if: steps.cf.outputs.ready == 'true'
        run: npm run test:captain-school

      - name: Write build ID
        if: steps.cf.outputs.ready == 'true'
        run: echo "$GITHUB_SHA" > public/build-id.txt

      - name: Build
        if: steps.cf.outputs.ready == 'true'
        env:
          VITE_BUILD_ID: ${{ github.sha }}
        run: npm run build

      - name: Deploy Worker and assets
        if: steps.cf.outputs.ready == 'true'
        run: npx wrangler deploy --var BUILD_ID:$GITHUB_SHA

      - name: Verify live shell freshness
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          check_live () {
            BASE="$1"
            echo "Checking $BASE"
            BUILD=""
            for attempt in {1..15}; do
              BUILD=$(curl -fsS -H "Cache-Control: no-cache" "$BASE/api/build-id?verify=$GITHUB_SHA&attempt=$attempt" || true)
              echo "Live build attempt $attempt: $BUILD"
              if [ "$BUILD" = "$GITHUB_SHA" ]; then break; fi
              sleep 2
            done
            test "$BUILD" = "$GITHUB_SHA"

            ROOT_BUILD=""
            for attempt in {1..15}; do
              curl -fsS -D /tmp/headers.txt -o /tmp/root.html -H "Cache-Control: no-cache" "$BASE/?verify=$GITHUB_SHA&root_attempt=$attempt"
              tr -d '\r' < /tmp/headers.txt > /tmp/headers-clean.txt
              ROOT_BUILD=$(awk -F': ' 'tolower($1)=="x-island-build"{print $2}' /tmp/headers-clean.txt | tail -1)
              echo "Root build attempt $attempt: $ROOT_BUILD"
              if [ "$ROOT_BUILD" = "$GITHUB_SHA" ]; then break; fi
              sleep 2
            done
            echo "--- response headers ---"
            cat /tmp/headers-clean.txt
            echo "--- root build markers ---"
            grep -n 'pageshow\|build-id\|src="/assets/' /tmp/root.html || true
            grep -qi '^cache-control:.*no-store' /tmp/headers-clean.txt
            test "$ROOT_BUILD" = "$GITHUB_SHA"
            grep -q 'window.addEventListener.*pageshow' /tmp/root.html
          }

          check_live "https://island-adventures-game.goislandadventures.workers.dev"
          check_live "https://theislandadventures.com"

      - name: Live account smoke test
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export TEST_PASSWORD="IslandTest-2026!"
          test_auth () {
            BASE="$1"
            TAG="$2"
            EMAIL="smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TAG}@example.com"
            export EMAIL
            node -e "const crypto=require('crypto');const salt=crypto.randomBytes(16);const proof=crypto.pbkdf2Sync(process.env.TEST_PASSWORD,salt,120000,32,'sha256');process.stdout.write(JSON.stringify({email:process.env.EMAIL,displayName:'Smoke Captain',passwordSalt:salt.toString('base64'),passwordProof:proof.toString('base64'),marketingOptIn:false}))" > /tmp/auth.json

            STATUS=$(curl -sS -o /tmp/register.json -w "%{http_code}" -c /tmp/cookies.txt -H "Content-Type: application/json" -X POST "$BASE/api/auth/register" --data-binary @/tmp/auth.json)
            echo "$BASE register -> $STATUS $(cat /tmp/register.json)"
            test "$STATUS" = "201"

            STATUS=$(curl -sS -o /tmp/me.json -w "%{http_code}" -b /tmp/cookies.txt "$BASE/api/auth/me")
            echo "$BASE me -> $STATUS $(cat /tmp/me.json)"
            test "$STATUS" = "200"
            node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/me.json','utf8'));if(j.player?.email!==process.env.EMAIL)process.exit(1)"

            curl -sS -o /dev/null -b /tmp/cookies.txt -H "Content-Type: application/json" -X POST "$BASE/api/auth/logout"

            STATUS=$(curl -sS -D /tmp/stale-session-headers.txt -o /tmp/stale-session.json -w "%{http_code}" -b /tmp/cookies.txt "$BASE/api/auth/me")
            echo "$BASE stale session -> $STATUS $(cat /tmp/stale-session.json)"
            test "$STATUS" = "200"
            node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/stale-session.json','utf8'));if(j.player!==null)process.exit(1)"
            tr -d '\r' < /tmp/stale-session-headers.txt | grep -qi '^set-cookie: ia_session=.*Max-Age=0'

            STATUS=$(curl -sS -o /tmp/salt.json -w "%{http_code}" "$BASE/api/auth/salt?email=$EMAIL")
            echo "$BASE salt -> $STATUS $(cat /tmp/salt.json)"
            test "$STATUS" = "200"
            export SALT=$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('/tmp/salt.json','utf8')).salt)")
            node -e "const crypto=require('crypto');const salt=Buffer.from(process.env.SALT,'base64');const proof=crypto.pbkdf2Sync(process.env.TEST_PASSWORD,salt,120000,32,'sha256');process.stdout.write(JSON.stringify({email:process.env.EMAIL,passwordProof:proof.toString('base64')}))" > /tmp/login.json

            STATUS=$(curl -sS -o /tmp/login-response.json -w "%{http_code}" -c /tmp/login-cookies.txt -H "Content-Type: application/json" -X POST "$BASE/api/auth/login" --data-binary @/tmp/login.json)
            echo "$BASE login -> $STATUS $(cat /tmp/login-response.json)"
            test "$STATUS" = "200"

            printf '%s\n' '{"state":{"companyName":"Smoke Charter Co","day":1,"cash":10000,"debt":0,"reputation":0.5,"rating":0,"reviewCount":0,"companyValue":10000,"lifetimeRevenue":0,"lifetimeProfit":0,"islandId":"harbor","boats":[]}}' > /tmp/company.json
            STATUS=$(curl -sS -o /tmp/company-save.json -w "%{http_code}" -b /tmp/login-cookies.txt -H "Content-Type: application/json" -X POST "$BASE/api/company/sync" --data-binary @/tmp/company.json)
            echo "$BASE company save -> $STATUS $(cat /tmp/company-save.json)"
            test "$STATUS" = "200"

            STATUS=$(curl -sS -o /tmp/company-load.json -w "%{http_code}" -b /tmp/login-cookies.txt "$BASE/api/company")
            echo "$BASE company load -> $STATUS $(cat /tmp/company-load.json)"
            test "$STATUS" = "200"
            node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/company-load.json','utf8'));if(j.state?.companyName!=='Smoke Charter Co')process.exit(1)"
          }

          test_auth "https://island-adventures-game.goislandadventures.workers.dev" "worker"
          test_auth "https://theislandadventures.com" "domain"

      - name: Clean smoke-test accounts
        if: always() && steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          npx wrangler d1 execute DB --remote --command "DELETE FROM players WHERE email LIKE 'smoke-${GITHUB_RUN_ID}-%@example.com';" || true
