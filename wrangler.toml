name = "island-adventures-game"
main = "src/worker/index.ts"
compatibility_date = "2026-09-30"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = [ "/", "/index.html", "/build-id.txt", "/api/*" ]

[[d1_databases]]
binding = "DB"
database_name = "island-adventures-game"
database_id = "REPLACE_AFTER_D1_CREATE"



# Custom domain will be re-enabled after conflicting parking DNS records are removed.
